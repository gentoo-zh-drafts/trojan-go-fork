name: Sync with upstream
on:
  push:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update mirror
        uses: peeweep/golang-dist-mirror-action@master
        with:
          token: ${{ secrets.PUSH_TOKEN }}
